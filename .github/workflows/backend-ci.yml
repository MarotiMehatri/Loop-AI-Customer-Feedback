name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "shared/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/backend-ci.yml"

  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "shared/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  backend-checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d loop_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/loop_test?schema=public
      JWT_ACCESS_SECRET: github-actions-access-secret
      JWT_REFRESH_SECRET: github-actions-refresh-secret
      FRONTEND_URL: http://localhost:3000
      ANTHROPIC_API_KEY: test-key-not-used
      ANTHROPIC_MODEL: test-model

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=shared --if-present

      - name: Generate Prisma Client
        run: npm exec --workspace=backend prisma generate

      - name: Validate Prisma schema
        run: npm exec --workspace=backend prisma validate

      - name: Apply database migrations
        run: npm exec --workspace=backend prisma migrate deploy

      - name: Run backend lint
        run: npm run lint --workspace=backend

      - name: Check backend TypeScript
        run: npm run type-check --workspace=backend

      - name: Run backend tests
        run: npm run test --workspace=backend --if-present

      - name: Build backend
        run: npm run build --workspace=backend
